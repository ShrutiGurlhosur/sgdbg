{{ define "main" }}
<article class="single-page rule-page">
  <header class="page-header">
    {{ if .Params.family }}<span class="category">{{ .Params.family }}</span>{{ end }}
    <h1>{{ .Title }}</h1>
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    </div>
    {{ partial "tags.html" . }}
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
  {{ if .Params.related_post }}
  <p class="related"><a href="{{ .Params.related_post }}">→ Read the related analysis</a></p>
  {{ end }}
</article>
{{ end }}
