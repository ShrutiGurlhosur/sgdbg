<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>
      &copy; {{ now.Year }} {{ .Site.Params.author }}.
      Content licensed for research &amp; educational use.
      All IOCs are for defensive threat-intelligence purposes only.
    </p>
    <p class="footer-links">
      {{ if .Site.Params.github }}<a href="{{ .Site.Params.github }}" target="_blank" rel="noopener">GitHub</a>{{ end }}
      {{ if .Site.Params.twitter }}<a href="{{ .Site.Params.twitter }}" target="_blank" rel="noopener">X / Twitter</a>{{ end }}
      <a href="{{ "index.xml" | absURL }}">RSS</a>
      {{ if .Site.Params.email }}<a href="mailto:{{ .Site.Params.email }}">Email</a>{{ end }}
    </p>
  </div>
</footer>
<script src="{{ "js/main.js" | absURL }}"></script>
