<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | absURL }}">
      <span class="prompt">$</span> {{ .Site.Title }}
    </a>
    <nav class="main-nav">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL | absURL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
      {{ if .Site.Params.github }}<a href="{{ .Site.Params.github }}" target="_blank" rel="noopener">GitHub</a>{{ end }}
    </nav>
    <button id="theme-toggle" aria-label="Toggle color theme" title="Toggle theme">◐</button>
  </div>
</header>
